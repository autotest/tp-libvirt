- io-github-autotest-libvirt.migration.migration_misc.migration_with_cpu_topology:
    virt_test_type = libvirt
    provider = io-github-autotest-libvirt
    type = migration_with_cpu_topology
    migration_setup = "yes"
    storage_type = "nfs"
    setup_local_nfs = "yes"
    disk_type = "file"
    disk_source_protocol = "netfs"
    mnt_path_name = ${nfs_mount_dir}
    only_pty = True
    take_regular_screendumps = no
    virsh_migrate_extra = ''
    ssh_timeout = 60
    virsh_migrate_connect_uri = 'qemu:///system'
    image_convert = 'no'
    server_ip = "${remote_ip}"
    server_user = "root"
    server_pwd = "${remote_pwd}"
    status_error = "no"
    migrate_desturi_port = "16509"
    migrate_desturi_type = "ssh"
    virsh_migrate_desturi = "qemu+ssh://${remote_ip}/system"
    start_vm = "no"
    topology_sockets = 1
    variants:
        - threads_2:
            topology_threads = 2
            topology_cores = 16
        - threads_4:
            topology_threads = 4
            topology_cores = 8
        - threads_8:
            topology_threads = 8
            topology_cores = 4
    variants:
        - p2p:
            virsh_migrate_options = '--live --p2p --verbose'
        - non_p2p:
            virsh_migrate_options = '--live --verbose'
        - postcopy:
            virsh_migrate_options = '--live --postcopy --verbose'
        - auto_converge:
            virsh_migrate_options = '--live --auto-converge --verbose'
