- virsh.await:
    type = virsh_await
    start_vm = "yes"
    kill_vm = "yes"
    kill_vm_before_test = "yes"
    await_vm_ref = "name"
    await_timeout = 30
    libvirtd = "on"
    variants:
        - domain_inactive:
            await_condition = "domain-inactive"
            variants:
                - normal_test:
                    status_error = "no"
                    await_expect_exit = 0
                    variants:
                        - shutdown_then_await:
                            await_pre_state = "running"
                            await_trigger = "shutdown"
                            await_timeout = 60

                        - already_shutoff:
                            no lxc
                            await_pre_state = "shutoff"
                            await_trigger = "none"
                            await_timeout = 5

                        - destroy_then_await:
                            no lxc
                            await_pre_state = "running"
                            await_trigger = "destroy"
                            await_timeout = 60

                        - ref_by_uuid:
                            await_pre_state = "shutoff"
                            await_vm_ref = "uuid"
                            await_trigger = "none"
                            await_timeout = 5

                        - ref_by_id:
                            no lxc
                            await_pre_state = "running"
                            await_vm_ref = "id"
                            await_trigger = "shutdown"
                            await_timeout = 60

                        - ref_by_hex_id:
                            no lxc
                            await_pre_state = "running"
                            await_vm_ref = "hex_id"
                            await_trigger = "shutdown"
                            await_timeout = 60

                - error_test:
                    status_error = "yes"
                    variants:
                        - timeout_expire:
                            await_pre_state = "running"
                            await_trigger = "none"
                            await_timeout = 2
                            await_expect_exit = 2

                        - invalid_domain:
                            await_pre_state = "running"
                            await_vm_ref = "invalid_domain"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

                        - empty_domain:
                            await_pre_state = "running"
                            await_vm_ref = "empty"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

                        - missing_condition:
                            await_pre_state = "running"
                            await_omit_condition = "yes"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

                        - unsupported_condition:
                            await_pre_state = "running"
                            await_condition = "not-a-real-condition"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

                        - acl_test:
                            setup_libvirt_polkit = "yes"
                            action_id = "org.libvirt.api.domain.read"
                            action_lookup = "connect_driver:QEMU domain_name:${main_vm}"
                            unprivileged_user = "EXAMPLE"
                            virsh_uri = "qemu:///system"
                            await_pre_state = "shutoff"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

        - guest_agent_available:
            no lxc
            await_condition = "guest-agent-available"
            variants:
                - normal_test:
                    status_error = "no"
                    await_expect_exit = 0
                    variants:
                        - agent_already_running:
                            await_pre_state = "running"
                            await_need_agent = "yes"
                            await_trigger = "none"
                            await_timeout = 60

                        - ref_by_uuid:
                            await_pre_state = "running"
                            await_need_agent = "yes"
                            await_vm_ref = "uuid"
                            await_trigger = "none"
                            await_timeout = 60

                - error_test:
                    status_error = "yes"
                    variants:
                        - timeout_no_agent:
                            await_pre_state = "running"
                            await_need_agent = "no"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 2

                        - domain_shutoff:
                            await_pre_state = "shutoff"
                            await_need_agent = "no"
                            await_trigger = "none"
                            await_timeout = 3
                            await_expect_exit = 2

                        - invalid_domain:
                            await_pre_state = "running"
                            await_vm_ref = "invalid_domain"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

                        - missing_condition:
                            await_pre_state = "running"
                            await_omit_condition = "yes"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

                        - unsupported_condition:
                            await_pre_state = "running"
                            await_condition = "not-a-real-condition"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1

                        - acl_test:
                            setup_libvirt_polkit = "yes"
                            action_id = "org.libvirt.api.domain.read"
                            action_lookup = "connect_driver:QEMU domain_name:${main_vm}"
                            unprivileged_user = "EXAMPLE"
                            virsh_uri = "qemu:///system"
                            await_pre_state = "running"
                            await_need_agent = "no"
                            await_trigger = "none"
                            await_timeout = 5
                            await_expect_exit = 1
