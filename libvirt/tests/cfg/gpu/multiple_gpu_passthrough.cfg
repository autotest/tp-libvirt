- gpu.multiple_gpu_passthrough:
    only aarch64
    type = multiple_gpu_passthrough
    start_vm = "no"
    mem_value = 32
    vcpu = 32
    test_devices = '["3D"]'

    variants:
        - one_gpu:
            num_gpus = 1
        - two_gpus:
            num_gpus = 2
        - four_gpus:
            num_gpus = 4

    variants:
        - pxb_pcie:
            pxb_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':0x00,'slot':'%s','function':'0x0'}}"
            pxb_ctrl_attrs = {'type':'pci','model':'pcie-expander-bus','index':'%s',${pxb_addr}}
            pcie_root_port_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
            pcie_root_port_attrs = {'type':'pci','model':'pcie-root-port','index':'%s',${pcie_root_port_addr}}

        - pxb_downstream:
            pxb_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':0x00,'slot':'%s','function':'0x0'}}"
            pxb_ctrl_attrs = {'type':'pci','model':'pcie-expander-bus','index':'%s','target':{'busNr':'241'},${pxb_addr}}
            pcie_root_port_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
            pcie_root_port_attrs = {'type':'pci','model':'pcie-root-port','index':'%s',${pcie_root_port_addr}}
            upstream_port_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
            upstream_port_attrs = {'type':'pci','model':'pcie-switch-upstream-port','index':'%s',${upstream_port_addr}}
            downstream_port_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
            downstream_port_attrs = {'type':'pci','model':'pcie-switch-downstream-port','index':'%s','target':{'chassis':'%s','port':'0x0'},${downstream_port_addr}}

    variants:
        - all_cmdqv_off:
            cmdqv_mode = "all_off"
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','cmdqv':'off','ats':'on','ril':'off','ssidsize':'20','oas':'48'}}
        - all_cmdqv_on:
            cmdqv_mode = "all_on"
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','cmdqv':'on','ats':'on','ril':'off','ssidsize':'20','oas':'48'}}
        - mixed_cmdqv:
            only two_gpus four_gpus
            cmdqv_mode = "mixed"
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','cmdqv':'on','ats':'on','ril':'off','ssidsize':'20','oas':'48'}}

    numa_attrs = "'cpu':{'numa_cell':[{'id':'0','cpus':'0-31','memory':'32','unit':'GiB'},{'id':'1','memory':'0'},{'id':'2','memory':'0'},{'id':'3','memory':'0'},{'id':'4','memory':'0'},{'id':'5','memory':'0'},{'id':'6','memory':'0'},{'id':'7','memory':'0'},{'id':'8','memory':'0'},{'id':'9','memory':'0'},{'id':'10','memory':'0'},{'id':'11','memory':'0'},{'id':'12','memory':'0'},{'id':'13','memory':'0'},{'id':'14','memory':'0'},{'id':'15','memory':'0'},{'id':'16','memory':'0'},{'id':'17','memory':'0'}]}"
    acpi_nodeset = {'nodeset':'2-5'}
    nodeset_map = {1: '6-9', 2: '10-13', 3: '14-17'}
    vm_attrs = {'memory_unit':'GiB','memory':${mem_value},'vcpu':${vcpu},${numa_attrs}}
    gpu_driver = "'driver':{'driver_attr':{'iommufd':'yes'}}"
    gpu_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
    gpu_hostdev_dict = {${gpu_driver},'acpi':${acpi_nodeset},'mode':'subsystem','type':'pci','source':{'untyped_address':gpu_pci_addr},'managed':'no',${gpu_addr}}
