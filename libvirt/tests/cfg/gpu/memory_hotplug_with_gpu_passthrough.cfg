- gpu.memory_hotplug_with_gpu_passthrough:
    only aarch64
    type = memory_hotplug_with_gpu_passthrough
    start_vm = "no"
    mem_value = 36
    guest_mem = 32
    vcpu = 32
    test_devices = '["3D"]'
    cmdqv_on_num = 1
    kernel_hp_file = '/sys/kernel/mm/hugepages/hugepages-%skB/nr_hugepages'

    variants:
        - hugepage_512M:
            hugepage_size = 512
            memory_backing = {'source_type':'memfd','hugepages':{'pages': [{'size': '512', 'unit':'MiB'}]},'access_mode':'shared','allocation':{'mode':'immediate'}}
        - hugepage_2M:
            hugepage_size = 2
            memory_backing = {'source_type':'memfd','hugepages':{'pages': [{'size': '2', 'unit':'MiB'}]},'access_mode':'shared','allocation':{'mode':'immediate'}}

    numa_attrs = "'cpu':{'numa_cell':[{'id':'0','cpus':'0-31','memory':'32','unit':'GiB'},{'id':'1','memory':'0'},{'id':'2','memory':'0'},{'id':'3','memory':'0'},{'id':'4','memory':'0'},{'id':'5','memory':'0'},{'id':'6','memory':'0'},{'id':'7','memory':'0'},{'id':'8','memory':'0'}]}"
    acpi_nodeset = {'nodeset':'1-8'}
    pxb_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':0x00,'slot':'%s','function':'0x0'}}"
    pxb_ctrl_attrs = {'type':'pci','model':'pcie-expander-bus','index':'%s',${pxb_addr}}
    pcie_root_port_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
    pcie_root_port_attrs = {'type':'pci','model':'pcie-root-port','index':'%s',${pcie_root_port_addr}}
    vm_attrs = {'memory_unit':'GiB','memory':${guest_mem},'vcpu':${vcpu},${numa_attrs}, 'max_mem_rt':37748736,'max_mem_rt_slots':16,'max_mem_rt_unit':'KiB'}
    gpu_driver = "'driver':{'driver_attr':{'iommufd':'yes'}}"
    gpu_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
    gpu_hostdev_dict = {${gpu_driver},'acpi':${acpi_nodeset},'mode':'subsystem','type':'pci','source':{'untyped_address':gpu_pci_addr},'managed':'no',${gpu_addr}}
    iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','cmdqv':'on','ats':'on','ril':'off','ssidsize':'20','oas':'48'}}
    mem_dict = {'mem_model':'dimm','target':{'size':2,'size_unit':'GiB','node':0}}
