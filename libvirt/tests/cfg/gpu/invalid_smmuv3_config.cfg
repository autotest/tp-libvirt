- gpu.invalid_smmuv3_config:
    only aarch64
    type = invalid_xml_config
    start_vm = "no"
    mem_value = 32
    vcpu = 32

    variants:
        - invalid_ssidsize_accel_on:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','ats':'on','ril':'off','pasid':'on','ssidsize':'22','oas':'48'}}
            expected_error = "'ssidsize' does not accept value"
        - invalid_ril_on_accel_on:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','ats':'on','ril':'on','pasid':'on','ssidsize':'20','oas':'48'}}
            expected_error = "Range Invalidation"
        - invalid_oas_accel_on:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','ats':'on','ril':'off','pasid':'on','ssidsize':'20','oas':'52'}}
            expected_error = "QEMU SMMUv3 model only implements auto, 44 bit, or 48 bit OAS"
        - invalid_ril_off_accel_off:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'off','ats':'on','ril':'off','pasid':'on','ssidsize':'20','oas':'48'}}
            expected_error = "accel must be enabled for iommu model"
        - invalid_ats_on_accel_off:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'off','ats':'on','ril':'on','pasid':'on','ssidsize':'20','oas':'48'}}
            expected_error = "accel must be enabled for iommu model"
        - invalid_oas_accel_off:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'off','ats':'off','ril':'on','pasid':'on','ssidsize':'20','oas':'48'}}
            expected_error = "accel must be enabled for iommu model"
        - invalid_ssidsize_accel_off:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'off','ats':'off','ril':'on','pasid':'on','ssidsize':'20','oas':'44'}}
            expected_error = "accel must be enabled for iommu model"
        - vfio_non_accel_unsupported:
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'off','ats':'off','ril':'on','oas':'44'}}
            expected_error = "accel must be enabled for iommu model"
        - invalid_vfio_no_iommufd_accel_on:
            gpu_hostdev_dict = {'acpi':${acpi_nodeset},'mode':'subsystem','type':'pci','source':{'untyped_address':gpu_pci_addr},'managed':'no',${gpu_addr}}
            iommu_dict = {'model':'smmuv3','driver':{'pciBus':'%s','accel':'on','ats':'on','ril':'off','oas':'48'}}
            expected_error = "vfio-pci endpoint devices without an iommufd backend"

    numa_attrs = "'cpu':{'numa_cell':[{'id':'0','cpus':'0-31','memory':'32','unit':'GiB'},{'id':'1','memory':'0'},{'id':'2','memory':'0'},{'id':'3','memory':'0'},{'id':'4','memory':'0'},{'id':'5','memory':'0'},{'id':'6','memory':'0'},{'id':'7','memory':'0'},{'id':'8','memory':'0'}]}"
    acpi_nodeset = {'nodeset':'1-8'}
    pxb_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':0x00,'slot':'%s','function':'0x0'}}"
    pxb_ctrl_attrs = {'type':'pci','model':'pcie-expander-bus','index':'%s',${pxb_addr}}
    pcie_root_port_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
    pcie_root_port_attrs = {'type':'pci','model':'pcie-root-port','index':'%s',${pcie_root_port_addr}}
    vm_attrs = {'memory_unit':'GiB','memory':${mem_value},'vcpu':${vcpu},${numa_attrs}}
    gpu_addr = "'address':{'attrs':{'type':'pci','domain':'0x0000','bus':'%s','slot':'0x00','function':'0x0'}}"
    gpu_hostdev_dict = {'driver':{'driver_attr':{'iommufd':'yes'}},'acpi':${acpi_nodeset},'mode':'subsystem','type':'pci','source':{'untyped_address':gpu_pci_addr},'managed':'no',${gpu_addr}}
