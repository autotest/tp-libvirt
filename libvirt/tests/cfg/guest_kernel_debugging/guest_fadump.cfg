- guest_kernel_debugging.guest_fadump:
    only ppc64le,ppc64
    type = guest_fadump
    main_vm = "avocado-vm"
    vms = "vm"
    mem = "32768"
    take_regular_screendumps = "no"
    login_timeout = 240
    toggle_registration = "no"
    registration_timeout = "300"
    guest_stress = "no"
    stress_time = "300"
    guest_upstream_kernel = "no"
    crash_utility = "no"
    crash_dir = "/var/crash/"
    debug_dir = "/home/"
    dump_options = "--memory-only --bypass-cache"
    start_vm = "yes"
    kill_vm = "yes"
    variants:
        - fadump_no_stress:
        - fadump_with_stress:
            guest_stress = "yes"
        - fadump_with_stress_crash_utility:
            crash_utility = "yes"
            guest_stress = "yes"
        - fadump_register_unregister:
            toggle_registration = "yes"
        - two_guests_fadump_no_stress:
            vms = "vm1 vm2"
            mem = "10000"
        - two_guests_fadump_with_stress:
            vms = "vm1 vm2"
            mem = "10000"
            guest_stress = "yes"
        - two_guests_fadump_with_stress_crash_utility:
            vms = "vm1 vm2"
            mem = "10000"
            crash_utility = "yes"
            guest_stress = "yes"
