# Memory Hotplug with Virsh Dump Test Configuration

- memory_hotplug_virshdump:
    type = memory_hotplug_virshdump
    start_vm = yes
    kill_vm = yes
    kill_vm_gracefully = yes
    
    # Memory configuration
    mem = 2097152
    current_mem = 2097152
    max_mem = 20971520
    max_mem_rt = 20971520
    mem_unit = "KiB"
    
    # Memory device parameters
    tg_size = 524288
    tg_sizeunit = "KiB"
    tg_node = 0
    mem_model = "dimm"
    slots = 40
    
    # VM configuration
    vcpu_cores = 4
    vcpu_threads = 1
    vcpu_sockets = 1
    numa_cells = 1
    
    variants:
        - continuous_hotplug:
            variants:
                - virshdump:
                    variants:
                        - positive:
                            variants:
                                - basic_test:
                                    mem_hotplug_iterations = 16
                                    mem_hotplug_delay = 10
                                    virshdump_iterations = 16
                                    virshdump_delay = 2
                                    dump_path = "./virsh_dumps"
                                    dump_options = "--memory-only --bypass-cache"
