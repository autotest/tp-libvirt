- virsh.pool_vol:
    type = virsh_pool_vol
    vms = ''
    main_vm = ''
    start_vm = no
    vol_capacity = "10G"
    status_error = "no"
    test_attach = "no"
    at_options = "--live"
    dt_options = "--live"
    test_attach_device = "no"
    ad_options = ""
    dd_options = ""
    disk_bus = "virtio"
    disk_slot = "0x09"

    variants:
        - dirpool:
            pool_name = "dirpool"
            pool_type = "dir"
            pool_target = "/var/lib/libvirt/images/dirpool"
            variants:
                - vol_qcow2:
                    vol_name = "vol1.qcow2"
                    vol_format = "qcow2"
                - vol_raw:
                    vol_name = "vol1.raw"
                    vol_format = "raw"
                - attach_disk_qcow2:
                    vol_name = "vol1.qcow2"
                    vol_format = "qcow2"
                    test_attach = "yes"
                    start_vm = yes
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdh"
                - attach_disk_raw:
                    vol_name = "vol1.raw"
                    vol_format = "raw"
                    test_attach = "yes"
                    start_vm = yes
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdh"

                - attach_device_xml_qcow2:
                    vol_name = "dir-vol1.qcow2"
                    vol_format = "qcow2"
                    test_attach_device = "yes"
                    start_vm = no
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdb"
                    disk_bus = "virtio"
                    disk_slot = "0x09"

                - attach_device_xml_raw:
                    vol_name = "dir-vol1.raw"
                    vol_format = "raw"
                    test_attach_device = "yes"
                    start_vm = no
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdb"
                    disk_bus = "virtio"
                    disk_slot = "0x09"

        - fspool:
            pool_name = "fspool"
            pool_type = "fs"
            pool_source_format = "ext4"
            pool_target = "/mnt/fs-pool"
            vol_capacity = "20G"
            variants:
                - vol_qcow2:
                    vol_name = "fsv1.qcow2"
                    vol_format = "qcow2"
                - vol_raw:
                    vol_name = "fsv1.raw"
                    vol_format = "raw"

                - attach_disk_qcow2:
                    vol_name = "fsv1.qcow2"
                    vol_format = "qcow2"
                    test_attach = "yes"
                    start_vm = yes
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdh"
                - attach_disk_raw:
                    vol_name = "fsv1.raw"
                    vol_format = "raw"
                    test_attach = "yes"
                    start_vm = yes
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdh"

                - attach_device_xml_qcow2:
                    vol_name = "fs-vol1.qcow2"
                    vol_format = "qcow2"
                    test_attach_device = "yes"
                    start_vm = no
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdb"
                    disk_bus = "virtio"
                    disk_slot = "0x09"

                - attach_device_xml_raw:
                    vol_name = "fs-vol1.raw"
                    vol_format = "raw"
                    test_attach_device = "yes"
                    start_vm = no
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdb"
                    disk_bus = "virtio"
                    disk_slot = "0x09"

        - defaultpool:
            pool_name = "defaultpool"
            pool_type = "dir"
            pool_target = "/var/lib/libvirt/images/defaultpool"
            variants:
                - vol_qcow2:
                    vol_name = "def-vol1.qcow2"
                    vol_format = "qcow2"
                - vol_raw:
                    vol_name = "def-vol1.raw"
                    vol_format = "raw"
                - attach_disk_qcow2:
                    vol_name = "def-vol1.qcow2"
                    vol_format = "qcow2"
                    test_attach = "yes"
                    start_vm = yes
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdh"
                - attach_disk_raw:
                    vol_name = "def-vol1.raw"
                    vol_format = "raw"
                    test_attach = "yes"
                    start_vm = yes
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdh"

                - attach_device_xml_qcow2:
                    vol_name = "def-vol1.qcow2"
                    vol_format = "qcow2"
                    test_attach_device = "yes"
                    start_vm = no
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdb"
                    disk_bus = "virtio"
                    disk_slot = "0x09"

                - attach_device_xml_raw:
                    vol_name = "def-vol1.raw"
                    vol_format = "raw"
                    test_attach_device = "yes"
                    start_vm = no
                    vms = avocado-vt-vm1
                    main_vm = avocado-vt-vm1
                    disk_target = "vdb"
                    disk_bus = "virtio"
                    disk_slot = "0x09"
