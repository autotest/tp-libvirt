                    boottype = 3
                    v2v_debug = force_on
                - encrypted:
                    variants:
                        - sles12sp5:
                            main_vm = v2vci-esx8.0-sles12sp5-x86_64-with-encrypted-btrfs
                            skip_vm_check = yes
                            skip_reason = 'LUKS-encrypted, cannot log in without inputting password during booting'
                            checkpoint = 'luks_dev_keys'
                            luks_keys = all:key:redhat123
                        - sles15sp6:
                            main_vm = v2vci-esx8.0-sles15sp6-with-encrypted-btrfs
                            boottype = 3
                            checkpoint = 'luks_dev_keys'
                            luks_keys = all:key:redhat123
                            skip_vm_check = yes
                            skip_reason = 'LUKS-encrypted, cannot log in without inputting password during booting'
                            version_required = "[libguestfs-1.56.1-3,);[libguestfs-fssupport-10.1-2,)"
        - print_blkhash:
            only esx_80
            only libvirt
            v2v_debug = force_on
            version_required = "[virt-v2v-2.7.1-12,)"
            checkpoint = "print_blkhash"
            msg_content_yes = "nbdcopy.*--blkhash"
        - log_libnbd_nbdcopy_version:
            only esx_80
            only libvirt
            v2v_debug = force_on
            version_required = "[virt-v2v-2.8.1-8,);[libnbd-1.22.2-2,)"
            checkpoint = "log_libnbd_nbdcopy_version"
            msg_content_yes = "(?:nbdcopy|libnbd)\s+[0-9]+(?:\.[0-9]+){1,2}(?:[-._][A-Za-z0-9~+]+)?"
        - print_mountpoint_stats:
            only esx_80
            only libvirt
            v2v_debug = force_on
            version_required = "[virt-v2v-2.8.1-8,)"
            checkpoint = "print_mountpoint_stats"
            msg_content_yes = "mountpoint stats:\s*\n\s+Size\s+Used\s+Available\s+Use%$"
        - char_slash:
            only esx_80
            only libvirt
            version_required = "[virt-v2v-2.10.0-5,)"
            checkpoint = "char_slash"
            skip_vm_check = yes
            main_vm = v2vci-esx8.0-rhel10.0-name-with-/-char

    variants:
        - positive_test:
            status_error = 'no'
        - negative_test:
            status_error = 'yes'
            only option_root.single,invalid_rhv_pem,no_copy_illegal,system_rhv_pem.unset,logs.open_source,keys.invalid,invalid_mac_ip,block_dev.small,no_space,inodes.less_inodes,windows.external_poweroff,must_ip,no_ovirtsdk4_pkg,vddk_errors_41_disks,invalid_vddk_thumbprint,invalid_os_storage,no_vpx_username,incompatible_cmd
