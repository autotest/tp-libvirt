- function_test_esx:
    type = 'function_test_esx'
    vm_type = 'libvirt'
    start_vm = 'no'
    take_regular_screendumps = no
    v2v_timeout = '7200'
    v2v_login_timeout = 1800
    default_output_format = 'qcow2'
    vpx_passwd_file = "/tmp/v2v_vpx_passwd"
    v2v_debug = on

    # Guest info
    main_vm = v2vci-esx8.0-rhel8.10-x86_64-tiny-os
    os_type = 'linux'
    username = 'root'
    password = redhat

    # Standard shell parameters
    remote_shell_client = 'ssh'
    remote_shell_port = 22
    remote_shell_prompt = '^\w:\\.*>\s*$|^\[.*\][\#\$]\s*$'
    status_test_command = 'echo $?'

    # All guests are in esx server, variant 'vms' is useless.
    vms = ''

    variants:
        - it_vddk:
            only source_esx
            input_transport = 'vddk'
            # Set the real vddk_libdir/thumbprint or keep it commented
            #vddk_libdir = VDDK_LIB_DIR_EXAMPLE
            #vddk_thumbprint = VDDK_THUMBPRINT_EXAMPLE
            variants:
                - vpx_uri:
                - esx_uri:
                    src_uri_type = 'esx'
        - it_default:
    variants:
        - kubevirt:
            only dest_kubevirt
        - json:
            only dest_json
            only uefi.win2019,device_map,without_ip_option,env_leak,block_dev
            variants:
                - default:
                  no block_dev
                - pattern:
                    json_disk_pattern = '%%{GuestName}-%{GuestName}-%{DiskDeviceName}-%{DiskNo}'
        - local:
            only dest_local
            only uefi.win2019,device_map,without_ip_option,env_leak,block_dev,cve_2022_2211
        - qemu:
            only dest_qemu
            only uefi.win2019
        - libvirt:
            only dest_libvirt
        - rhev:
            only dest_rhev.NFS
            variants:
                - rhv_upload:
                    output_method = "rhv_upload"
                    rhv_upload_passwd = ${ovirt_engine_password}
                    rhv_upload_passwd_file = "/tmp/rhv_upload_passwd_file"
                    rhv_upload_opts = "-oc ${ovirt_engine_url} -op ${rhv_upload_passwd_file} -oo rhv-cafile=${local_ca_file_path} -oo rhv-cluster=${cluster_name}"
                - rhv:
                    output_method = "rhev"
            no uefi,GPO_AV,special_name,suse,unset,lvm_multiple_disks,genid_xml
    variants:
        - esx_70:
            only source_esx.esx_70
        - esx_80:
            only source_esx.esx_80
    variants:
        - windows:
            os_type = 'windows'
            shutdown_command = 'shutdown /s /f /t 0'
            reboot_command = 'shutdown /r /f /t 0'
            status_test_command = 'echo %errorlevel%'
            shell_prompt = '^\w:\\.*>\s*$'
            shell_linesep = '\r\n'
            shell_client = 'nc'
            shell_port = 10022
            file_transfer_client = 'rss'
            file_transfer_port = 10023
            redirs += ' file_transfer'
            guest_port_remote_shell = 10022
            guest_port_file_transfer = 10023
            rtc_base = 'localtime'
            network_query = 'ipconfig /all'
            restart_network = 'ipconfig /renew'
            vm_user = 'Administrator'
            vm_pwd = 123qweP
            variants:
                 - skip_qemufwcfg:
                    only esx_80
                    main_vm = v2vci-esx8.0-win2022-x86_64
                    version_required = "[virt-v2v-2.2.0-5,)"
                    msg_content_yes = "windows: skipping qemufwcfg stub driver in favor of fwcfg driver"
                    v2v_debug = force_on
                - program_files_2:
                    only esx_80
                    os_version = 'win2016'
                    main_vm = 'v2vci-esx8.0-win2016-2ProgramFiles'
                    expect_msg = 'no'
                    msg_content = 'case_sensitive_path: v2v: no file or directory'
                - rhev_file:
                    only esx_80
                    no libvirt
                    checkpoint = 'rhev_file'
                    os_version = win2019
                    main_vm = v2vci-esx8.0-win2019-x86_64
                    expect_msg = 'no'
                    msg_content = 'virt-v2v: warning: /usr/share/virt-tools/pnp_wait.exe is missing.*?Firstboot scripts may conflict with PnP'
                - uefi:
                    boottype = 3
                    variants:
                        - win2019:
                            only esx_80
                            main_vm = v2vci-esx8.0-win2019-x86_64-efi
                            os_version = "win2019"
                            checkpoint = 'fstrim_warning'
                            msg_content = 'virt-v2v: warning: fstrim on guest filesystem /dev/.*? failed.  Usually'
                            expect_msg = yes
                - OGAC_balloon:
                    only esx_80
                    only dest_libvirt
                    checkpoint = "ogac_balloon"
                    #Not use virtio_win_path due to bug RHEL-69035
                    #virtio_win_path = /usr/share/virtio-win/
                    variants:
                        - win2022:
                            os_version = "win2022"
                            main_vm = "v2vci-esx8.0-win2022-x86_64"
                        - win2025:
                            os_version = "win2025"
                            main_vm = "v2vci-esx8.0-win2025-x86_64-efi"
                            boottype = 3
                        - win11:
                            os_version = "win11"
                            main_vm = "v2vci-esx8.0-win11-x86_64-efi"
                            boottype = 3
                        - win10:
                            os_version = "win10"
                            main_vm = v2vci-esx8.0-win10-x86_64
                        - win2016:
                            main_vm = v2vci-esx8.0-win2016-x86_64
                            os_version = "win2016"
                        - win2019:
                            main_vm = v2vci-esx8.0-win2019-x86_64-efi
                            os_version = "win2019"
                            boottype = 3
                - virtio_win:
                    only esx_80
                    main_vm = 'v2vci-esx8.0-win2019-x86_64'
                    os_version = 'win2019'
                    virtio_win_dir = '/usr/share/virtio-win/'
                    virtio_win_env = 'VIRTIO_WIN'
                    checkpoint = 'virtio_win_'
                    variants:
                        - unset:
                            # no need to check guest if the guest is converted without virtio-win
                            skip_vm_check = yes
                        - custom:
                            checkpoint += 'custom'
                        - iso_mount:
                            checkpoint += 'iso_mount'
                        - iso_file:
                            checkpoint += 'iso_file'
                - virtio_iso_blk:
                    only esx_80
                    checkpoint = "virtio_iso_blk"
                    virtio_win_path = '/usr/share/virtio-win/virtio-win.iso'
                    main_vm = v2vci-esx8.0-win2019-x86_64
                    os_version = "win2019"
                - mac_ip:
                    only libvirt
                    checkpoint = 'mac_ip'
                    variants:
                        - 3_static_ip:
                            only esx_80
                            variants:
                                - win10:
                                    main_vm = v2vci-esx8.0-win10-efi-with-multl-nets
                                    boottype = 3
                                    v2v_opts = '--mac 00:50:56:a0:5d:95:ip:10.184.112.42,10.184.112.1,24,10.10.10.53,10.10.10.54 --mac 00:50:56:a0:d8:5f:ip:192.168.0.10,,,8.8.8.8 --mac 00:50:56:a0:67:e5:ip:192.168.0.1,192.168.1.1,22,8.8.9.9,9.9.8.8'
                        - empty_gw:
                            only esx_80
                            variants:
                                - win11:
                                    main_vm = v2vci-esx8.0-win11-with-extra-online-disks
                                    boottype = 3
                                    v2v_opts = '--mac 00:50:56:a0:1d:6d:ip:192.168.0.10,,,8.8.8.8'
                                - win2022:
                                    main_vm = v2vci-esx8.0-win2022-with-extra-online-disks
                                    v2v_opts = '--mac 00:50:56:a0:36:e6:ip:192.168.0.10,,,8.8.8.8'
                        - 1_static_ip:
                            only esx_80
                            variants:
                                - win2019:
                                    main_vm = v2vci-esx8.0-win2019-efi-with-extra-online-disks
                                    boottype = 3
                                    v2v_opts = '--mac 00:50:56:a0:a7:f4:ip:192.168.0.1,192.168.1.1,22,8.8.9.9,9.9.8.8'
                                - win2025:
                                    main_vm = v2vci-esx8.0-win2025-efi-with-extra-online-disks
                                    boottype = 3
                                    v2v_opts = '--mac 00:50:56:a0:68:21:ip:10.184.112.42,10.184.112.1,24,10.10.10.53,10.10.10.54'
                - virt_customize:
                    only esx_80
                    # Test firstboot(windows), firstboot-command, firstboot-install, ssh-inject, root-password,
                    # password-crypto, run-command, touch, chown, scrub, update, write, edit.
                    # The others has been automated in libguestfs plan. Need to test upload and run options because it's used in MTV
                    mac_addr = 00-50-56-A5-F2-D6
                    static_mac_ip = 10.184.112.42,10.184.112.1,24,10.10.10.53,10.10.10.54
                    main_vm = v2vci-esx8.0-win2025-with-custom-network-script
                    boottype = 3
                    variants:
                        - firstboot_and_upload:
                            checkpoint = "virt_customize_firstboot_and_upload_option"
                        - firstboot_command:
                            checkpoint = "virt_customize_firstboot_cmd_option"
                - vmware_tools:
                    only esx_80
                    only dest_libvirt
                    checkpoint = 'vmware_tools'
                    variants:
                        - win2022:
                            os_version = "win2022"
                            main_vm = "v2vci-esx8.0-win2022-x86_64"
                        - win2025:
                            os_version = "win2025"
                            main_vm = "v2vci-esx8.0-win2025-x86_64-efi"
                            boottype = 3
                        - win11:
                            os_version = "win11"
                            main_vm = v2vci-esx8.0-win11-x86_64-efi
                            boottype = 3
                        - win10:
                            os_version = "win10"
                            main_vm = v2vci-esx8.0-win10-x86_64-efi
                            boottype = 3
                        - win2016:
                            main_vm = v2vci-esx8.0-win2016-x86_64
                            os_version = "win2016"
                        - win2019:
                            main_vm = v2vci-esx8.0-win2019-x86_64-efi
                            os_version = "win2019"
                            boottype = 3
                - multiple_online_disks:
                    only esx_80
                    only dest_libvirt
                    checkpoint = 'check_online_disks'
                    variants:
                        - win2022:
                            os_version = "win2022"
                            main_vm = v2vci-esx8.0-win2022-with-extra-online-disks
                        - win2025:
                            os_version = "win2025"
                            main_vm = v2vci-esx8.0-win2025-efi-with-extra-online-disks
                            boottype = 3
                        - win11:
                            os_version = "win11"
                            main_vm = v2vci-esx8.0-win11-with-extra-online-disks
                            boottype = 3
                        - win2019:
                            main_vm = v2vci-esx8.0-win2019-efi-with-extra-online-disks
                            os_version = "win2019"
                            boottype = 3
                - rhsrvany_md5:
                    only esx_80
                    checkpoint = 'rhsrvany_checksum'
                    main_vm = v2vci-esx8.0-win2019-x86_64
                    os_version = 'win2019'
                - external_poweroff:
                    only esx_80
                    only negative_test
                    main_vm = v2vci-esx8.0-win2022-poweroff-external
                    msg_content = "virt-v2v: error: filesystem was mounted read-only, even though we asked for it to be mounted read-write."
                    expect_msg = yes
                - genid_xml:
                    only dest_libvirt
                    only esx_80
                    version_requried = "[libvirt-7.6.0-2,)"
                    checkpoint = 'genid_xml'
                    main_vm = VM_NAME_GENID_WIN2019_V2V_EXAMPLE
                    os_version = "win2019"
                - ovirt_id:
                    only esx_80
                    only rhev..rhv_upload
                    version_required = "[virt-v2v-2.2.0-5,)"
                    v2v_debug = force_on
                    variants:
                        - win2019:
                            main_vm = v2vci-esx8.0-win2019-x86_64
                            msg_content_yes = "ovirt:id='31'"
                            os_version = win2019
                        - win2022:
                            main_vm = v2vci-esx8.0-win2022-x86_64
                            msg_content_yes = "ovirt:id='37'"
                            os_version = win2022
                        - win11:
                            main_vm = v2vci-esx8.0-win11-x86_64-efi
                            msg_content_yes = "ovirt:id='36'"
                            os_version = win11
                - windows_vm_with_nvme_disk:
                    only esx_80
                    only dest_libvirt
                    version_required = "[libvirt-11.5.0-1,)"
                    os_type = 'windows'
                    os_version = 'win2022'
                    boottype = 1
                    main_vm = v2vci-esx8.0-win2022-nvme-disk-thin-provision
                - multiple_os:
                    main_vm = v2vci-esx8.0-windows-guests-with-mutiple-os
                    checkpoint = root
                    v2v_timeout = '7200'
                    interaction_run = 'yes'
                    version_required = "[virt-v2v-2.10.0-5,)"
                    boottype = 3
                    only esx_80
                    variants:
                        - first_os:
                            root_option = first
                        - second_os:
                            root_option = '/dev/sdb3'
                            v2v_debug = false
                            skip_vm_check = yes
                            skip_reason = "RHEL-122817 isn't fixed yet"
        - virt_customize:
            only esx_80
            main_vm = v2vci-esx8.0-rhel9.7-x86_64-efi-with-ext4-and-repo
            boottype = 3
            variants:
                - file_related:
                    # Test ssh-inject, touch, write, scrub, edit
                    checkpoint = "virt_customize_file_related"
                - pkg_related:
                    # Test firstboot-install, run, run-command, update
                    checkpoint = "virt_customize_pkg_related"
                - permission_related:
                    # Test root-password, password-crypto, chown
                    checkpoint = "virt_customize_permission_related"
                    password = 123456
                - incompatible_cmd:
                    checkpoint = 'virt_customize_incompatible_cmd'
                    only negative_test
                    version_required = "[virt-v2v-2.9.9-2,)"
                    main_vm = v2vci-esx8.0-win2025-with-custom-network-script
                    msg_content = 'virt-v2v: error: host .*? and guest .*? are not compatible, .*? Use --firstboot scripts instead'
                    expect_msg = yes
                    v2v_debug = false
        - linux_vm_with_nvme_disk:
            only esx_80
            only dest_libvirt
            version_required = "[libvirt-11.5.0-1,)"
            os_type = 'linux'
            os_version = 'rhel8.10'
            main_vm = v2vci-esx8.0-rhel8.10-nvme-disk
            skip_vm_check = yes
            skip_reason = "virt-v2v: warning: /files/boot/grub2/device.map/hd0 references unknown device 'nvme0n1'."
        - with_cdrom:
            only esx_80
            main_vm = 'v2vci-esx8.0-rhel10.1-local-with-cdrom'
            checkpoint = 'cdrom'
        - vddk_errors:
            only esx_80
            #add required version due to bug2104720
            version_requried = "[nbdkit-1.30.8-1,)"
            main_vm = 'v2vci-esx8.0-rhel8.6-x86_64'
            fqdn_record = '10.6.172.55 vcenter8.virt.eng.rdu2.dc.redhat.com'
            checkpoint = 'vddk_error'
            msg_content = "VDDK_PhoneHome"
            expect_msg = no
        - vddk_errors_41_disks:
            only negative_test
            only rhev
            only esx_80
            #add required version due to bug2051564
            version_requried = "[virt-v2v-2.0.7-1,)"
            main_vm = 'v2vci-esx8.0-rhel8.7-with-41-disks'
            fqdn_record = '10.6.172.55 vcenter8.virt.eng.rdu2.dc.redhat.com'
            checkpoint = 'vddk_error'
            msg_content_no = "VDDK_PhoneHome"
            msg_content_yes = "virt-v2v: error: this output module doesn't support copying more than 23 disks"
        - migrated_vm:
            only esx_80
            main_vm = 'v2vci-esx8.0-rhel7.9-migration'
            libguestfs_backend = 'direct'
        - multiple_cpus:
            only esx_80
            main_vm = 'v2vci-esx8.0-rhel8.6-x86_64'
        - special_name:
            only esx_80
            #add required version due to bug2076013
            version_required = "[virt-v2v-2.0.7-1,)"
            #rhv env does not allowed guest to have special characters
            only libvirt
            main_vm = "'v2vci-esx8.0-rhel10.0-special chars~!@#$%^&*_=+,?><:;|."[]()`-%-pad123456789'"
            checkpoint = 'special_name'
        - cloned_vm:
            only esx_80
            boottype = 3
            main_vm = 'v2vci-esx8.0-rhel8.10-x86_64-efi'
        - esx_template:
            only esx_80
            boottype = 3
            main_vm = 'v2vci-esx8.0-rhel8.3-efi-from-templete'
        - esx_snapshot:
            only esx_80
            checkpoint = snapshot
            main_vm = v2vci-esx8.0-rhel7.7-snapshot
            removed_file = /home/bug1172425/case13022.log
        - uefi:
            boottype = 3
            version_required = "[libguestfs-1.40,)"
            variants:
                - ovmf:
                    variants:
                        - rhel7:
                            only esx_80
                            main_vm = v2vci-esx8.0-rhel7.7-efi-secure-boot
        - raid:
            variants:
                -  bios:
                    only esx_80
                    main_vm = v2vci-esx8.0-rhel8.10-raid1
                -  uefi:
                    boottype = 3
                    version_required = "[libguestfs-1.40,)"
                    only source_esx.esx_80
                    main_vm = v2vci-esx8.0-rhel7.6-uefi-raid
        - iscsi_storage:
            only esx_80
            main_vm = "v2vci-esx8.0-rhel8.7-iscsi-storage"
        - GPO_AV:
            only esx_80
            main_vm = 'v2vci-esx8.0-win2008R2-GPO-Macfee'
            checkpoint = 'GPO_AV'
            msg_content = 'virt-v2v: warning: this guest has Windows Group Policy Objects%virt-v2v: warning: this guest has Anti-Virus \(AV\) software'
            expect_msg = yes
            skip_vm_check = yes
            skip_reason = 'guest version is too old'
        - AV_WIN7:
            only esx_80
            main_vm = 'v2vci-esx8.0-win2008R2-GPO-Macfee'
            msg_content = 'virt-v2v: warning: this guest has Anti-Virus \(AV\) software'
            expect_msg = yes
            skip_vm_check = yes
            skip_reason = 'guest version is too old'
        - vmtools:
            variants:
                - pkgs:
                    only esx_80
                    main_vm = v2vci-esx8.0-rhel7.9-vmware-tool
                    checkpoint = vmtools
                    removed_pkgs = vmware-tools-libraries-nox,vmware-tools-foundation,vmware-tools-libraries-x
                - service:
                    only esx_80
                    main_vm = v2vci-esx8.0-rhel7.9-vmware-tool
                    checkpoint = "vmtools,service
                    service_name = vmware-tools
        - modprobe:
            only esx_80
            main_vm = v2vci-esx8.0-rhel6.10-x86_64
            enable_legacy_policy = yes
            checkpoint = modprobe
            cfg_content = 'alias eth0 virtio_net'
        - passthru:
            only esx_80
            main_vm = v2vci-esx8.0-rhel8.3-pci-passthrough
        - empty_cdrom:
            only esx_80
            version_required = "[libvirt-10.8.0-1,)"
            boottype = 3
            main_vm = v2vci-esx8.0-rhell9.3-efi-with-empty-ide-sata-cdrom
            skip_vm_check = yes
            skip_reason = 'bug RHEL-38633 is not fixed'
        - option_root:
            main_vm = v2vci-esx8.0-multiple_linux_os
            checkpoint = root
            v2v_timeout = '7200'
            interaction_run = 'yes'
            variants:
                - ask:
                    only esx_80
                    main_vm = v2vci-esx8.0-multiple_linux_os
                    root_option = ask
                    choice = 2
                    msg_content = 'virt-v2v: warning: fstrim on guest filesystem'
                    expect_msg = no
                - first:
                    only esx_80
                    root_option = first
                    skip_vm_check = yes
                    skip_reason = "Can't boot into first os  without selecting by user during booting after v2v conversion"
                - single:
                    only esx_80
                    root_option = single
                    only negative_test
                - dev_sdx:
                    only esx_80
                    root_option = '/dev/sda1'
                    skip_vm_check = yes
                    skip_reason = "/dev/sda1 belongs to the first OS which can't boot into without selecting by user during booting after v2v conversion"
                - dev_vglv:
                    only esx_80
                    root_option = '/dev/rhel/root'
            checkpoint += ,${root_option}
        - device_map:
            only esx_80
            checkpoint = device_map
            main_vm = v2vci-esx8.0-rhel7.9-multi-disks
            device_map_path = /boot/grub2/device.map
        - fstab_comma:
            only esx_80
            main_vm = v2vci-esx8.0-rhel7.6-foo
        - with_proxy:
            only esx_80
            main_vm = v2vci-esx8.0-rhel7.8-x86_64
            checkpoint = with_proxy
            esx_http_proxy = http://squid.apac.redhat.com:3128
            esx_https_proxy = http://squid.apac.redhat.com:3128
        - usr_partition:
            only esx_80
            version_required = "[virt-v2v-2.8.1-8,)"
            main_vm = v2vci-esx8.0-rhel8.3-usr-partition
            checkpoint = "ogac"
        - dir_permission:
            only esx_80
            main_vm = v2vci-esx8.0-rhel8.10-x86_64-tiny-os
            version_required = "[virt-v2v-1.45.99-2,)"
            msg_content = 'setting owner of .*? to 107:root'
            expect_msg = yes
            v2v_debug = force_on
        - lvm_multiple_disks:
            only esx_80
            version_required = "[virt-v2v-2.8.1-10,)"
            main_vm = v2vci-esx8.0-rhel7.5-multi-disks
            checkpoint = 'check_boot_order'
            v2v_debug = force_on
        - ubuntu_os_multiple_disks:
            only esx_80
            version_required = "[virt-v2v-2.8.1-10,)"
            main_vm = v2vci-esx8.0-ubuntu18.04-without-boot-partition
            checkpoint = 'check_boot_order'
            v2v_debug = force_on
        - resume_rhel7:
            only esx_80
            os_version = rhel7
            checkpoint = resume_swap
            main_vm = v2vci-esx8.0-rhel7.9-check-resume-in-grub
        - resume_rhel6:
            only esx_80
            enable_legacy_policy = yes
            os_version = rhel6
            checkpoint = resume_swap
            main_vm = v2vci-esx8.0-rhel6.10-x86_64-resume-mls
        - resume_mapper:
            only esx_80
            msg_content = 'unknown device "mapper"'
            expect_msg = no
            main_vm = v2vci-esx8.0-rhel8.4-x86_64
