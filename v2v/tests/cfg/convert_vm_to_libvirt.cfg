- convert_vm_to_libvirt:
    type = "convert_vm_to_libvirt"
    take_regular_screendumps = "no"
    vms = ""
    start_vm = "no"
    remote_preprocess = "no"
    only dest_libvirt
    v2v_debug = on
    enable_vsock_check = yes

    username = "root"
    password = GENERAL_GUEST_PASSWORD

    # Prepare libvirt network as convert output network
    network = "v2v_net_0"
    network_addr = "192.168.10.1"
    network_dhcp_start = "192.168.10.2"
    network_dhcp_end = "192.168.10.254"

    variants:
        - it_vddk:
            only source_none
            hypervisor = esx
            input_transport = 'vddk'
            # Set the real vddk_libdir/thumbprint or keep it commented
            #vddk_libdir = VDDK_LIB_DIR_EXAMPLE
            #vddk_thumbprint = VDDK_THUMBPRINT_EXAMPLE
            variants:
                - vpx_uri:
                - esx_uri:
                    src_uri_type = 'esx'
        - it_nfc:
            only source_none
            hypervisor = esx
            input_transport = 'nfc'
            variants:
                - vpx_uri:
                - esx_uri:
                    src_uri_type = 'esx'
        - it_default:
    variants:
        - arch_x86_64:
    variants:
        - boot_bios:
            boottype = 1
        - boot_uefi:
            boottype = 3
    variants:
        - linux:
            os_type = "linux"
            vm_user = ${username}
            vm_pwd = ${password}
            variants:
                - latest10_dev:
                    expect_os_short_id = "RHEL10_DEV_SHORT_ID"
                    main_vm = VM_NAME_RHEL_LATEST10_DEV_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_RHEL_LATEST10_DEV_X86_64_UEFI_V2V_EXAMPLE
                - latest10:
                    expect_os_short_id = "RHEL10_SHORT_ID"
                    main_vm = VM_NAME_RHEL_LATEST10_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_RHEL_LATEST10_X86_64_UEFI_V2V_EXAMPLE
                - latest9_dev:
                    expect_os_short_id = "RHEL9_DEV_SHORT_ID"
                    main_vm = VM_NAME_RHEL_LATEST9_DEV_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_RHEL_LATEST9_DEV_X86_64_UEFI_V2V_EXAMPLE
                - latest9:
                    expect_os_short_id = "RHEL9_SHORT_ID"
                    main_vm = VM_NAME_RHEL_LATEST9_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_RHEL_LATEST9_X86_64_UEFI_V2V_EXAMPLE
                - latest8:
                    expect_os_short_id = "RHEL8_SHORT_ID"
                    main_vm = VM_NAME_RHEL_LATEST8_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_RHEL_LATEST8_X86_64_UEFI_V2V_EXAMPLE
                - 9_4:
                    only boot_bios
                    main_vm = VM_NAME_RHEL9_4_X86_64_BIOS_V2V_EXAMPLE
                - latest7:
                    only boot_bios
                    expect_os_short_id = "RHEL7_SHORT_ID"
                    main_vm = VM_NAME_RHEL_LATEST7_X86_64_BIOS_V2V_EXAMPLE
                - latest6:
                    only boot_bios
                    enable_legacy_policy = yes
                    main_vm = VM_NAME_RHEL_LATEST6_X86_64_BIOS_V2V_EXAMPLE
                - debian_lts:
                    only boot_bios
                    #expect_os_short_id = "DEBIAN_SHORT_ID"
                    main_vm = VM_NAME_DEBIAN_LTS_X86_64_BIOS_V2V_EXAMPLE
                - ubuntu_lts:
                    expect_os_short_id = "UBUNTU_LTS_SHORT_ID"
                    main_vm = VM_NAME_UBUNTU_LTS_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_UBUNTU_LTS_X86_64_UEFI_V2V_EXAMPLE
                - sles12sp5:
                    only boot_bios
                    expect_os_short_id = "sles12sp5"
                    main_vm = VM_NAME_SLES12SP5_X86_64_BIOS_V2V_EXAMPLE
                - sles_lts:
                    main_vm = VM_NAME_SLES_LTS_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_SLES_LTS_X86_64_UEFI_V2V_EXAMPLE
                - opensuse_latest:
                    expect_os_short_id = "OPENSUSE_LATEST_SHORT_ID"
                    main_vm = VM_NAME_OPENSUSE_LATEST_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_OPENSUSE_LATEST_X86_64_UEFI_V2V_EXAMPLE
        - windows:
            no pv
            os_type = "windows"
            shutdown_command = "shutdown /s /f /t 0"
            reboot_command = "shutdown /r /f /t 0"
            status_test_command = "echo %errorlevel%"
            shell_prompt = "^\w:\\.*>\s*$"
            shell_linesep = "\r\n"
            shell_client = "nc"
            shell_port = 10022
            file_transfer_client = "rss"
            file_transfer_port = 10023
            redirs += " file_transfer"
            guest_port_remote_shell = 10022
            guest_port_file_transfer = 10023
            rtc_base = "localtime"
            network_query = "ipconfig /all"
            restart_network = "ipconfig /renew"
            vm_user = "Administrator"
            vm_pwd = DEFAULT_WIN_VM_PASSWORD
            variants:
                - win10:
                    main_vm = VM_NAME_WIN10_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_WIN10_X86_64_UEFI_V2V_EXAMPLE
                - win2016:
                    expect_os_short_id = "win2k16"
                    main_vm = VM_NAME_WIN2016_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_WIN2016_X86_64_UEFI_V2V_EXAMPLE
                - win2019:
                    main_vm = VM_NAME_WIN2019_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_WIN2019_X86_64_UEFI_V2V_EXAMPLE
                - win2022:
                    main_vm = VM_NAME_WIN2022_X86_64_BIOS_V2V_EXAMPLE
                    boot_uefi:
                        main_vm = VM_NAME_WIN2022_X86_64_UEFI_V2V_EXAMPLE
                - win11:
                    only boot_uefi
                    main_vm = VM_NAME_WIN11_X86_64_UEFI_V2V_EXAMPLE
                - win2025:
                    only boot_uefi
                    main_vm = VM_NAME_WIN2025_X86_64_UEFI_V2V_EXAMPLE
    variants:
        - esx:
            only source_none
            hypervisor = esx
            vpx_passwd_file = "/tmp/v2v_vpx_passwd"
            v2v_opts = " -ip ${vpx_passwd_file}"
            variants:
                - 8_0:
            variants:
                - vm:
