- convert_vm_to_libvirt:
    type = "convert_vm_to_libvirt"
    take_regular_screendumps = "no"
    main_vm = ""
    vms = ""
    start_vm = "no"
    remote_preprocess = "no"
    only dest_libvirt
    v2v_debug = on
    v2v_login_timeout = 900
    enable_vsock_check = yes

    username = "root"
    password = GENERAL_GUEST_PASSWORD

    # Prepare libvirt network as convert output network
    network = "v2v_net_0"
    network_addr = "192.168.10.1"
    network_dhcp_start = "192.168.10.2"
    network_dhcp_end = "192.168.10.254"

    variants:
        - it_vddk:
            only source_esx
            input_transport = 'vddk'
            # Set the real vddk_libdir/thumbprint or keep it commented
            #vddk_libdir = VDDK_LIB_DIR_EXAMPLE
            #vddk_thumbprint = VDDK_THUMBPRINT_EXAMPLE
            variants:
                - vpx_uri:
                - esx_uri:
                    src_uri_type = 'esx'
        - it_nfc:
            only source_esx
            input_transport = 'nfc'
            variants:
                - vpx_uri:
                - esx_uri:
                    src_uri_type = 'esx'
        - it_default:
    variants:
        - arch_i386:
            only latest6, win10
            vm_arch = "i386"
        - arch_x86_64:
            vm_arch = "x86_64"
    variants:
        - boot_bios:
            vm_boot = ""
            boottype = 1
        - boot_uefi:
            vm_boot = "-efi"
            boottype = 3
            only 8_0.linux.latest10_dev, 8_0.linux.latest10, 8_0.linux.latest9_dev, 8_0.linux.latest9, 8_0.linux.latest8, 8_0.linux.ubuntu_lts, 8_0.linux.sles_lts, 8_0.linux.opensuse_latest, 8_0.windows.win2022, 8_0.windows.win11, 8_0.windows.win10, 8_0.windows.win2016, 8_0.windows.win2019, 8_0.windows.win2025
    variants:
        - linux:
            os_type = "linux"
            vm_user = ${username}
            vm_pwd = ${password}
            variants:
                - latest10_dev:
                    expect_os_short_id = "RHEL10_DEV_SHORT_ID"
                    vm_os_label = "LATEST_DEV_10"
                - latest10:
                    expect_os_short_id = "RHEL10_SHORT_ID"
                    vm_os_label = "LATEST10"
                - latest9_dev:
                    expect_os_short_id = "RHEL9_DEV_SHORT_ID"
                    vm_os_label = "LATEST_DEV_9"
                - latest9:
                    expect_os_short_id = "RHEL9_SHORT_ID"
                    vm_os_label = "LATEST9"
                - latest8:
                    expect_os_short_id = "RHEL8_SHORT_ID"
                    vm_os_label = "LATEST8"
                - 9_4:
                    vm_os_label = "rhel9.4"
                - latest7:
                    expect_os_short_id = "RHEL7_SHORT_ID"
                    vm_os_label = "LATEST7"
                - latest6:
                    vm_os_label = "LATEST6"
                    enable_legacy_policy = yes
                - debian_lts:
                    only source_esx.esx_80
                    #expect_os_short_id = "DEBIAN_SHORT_ID"
                    vm_os_label = "DEBIAN_LTS_VERSION"
                - ubuntu_lts:
                    only source_esx.esx_80
                    expect_os_short_id = "UBUNTU_LTS_SHORT_ID"
                    vm_os_label = "UBUNTU_LTS_VERSION"
                - sles12sp5:
                    only source_esx.esx_80
                    expect_os_short_id = "sles12sp5"
                    vm_os_label = "sles12sp5"
                - sles_lts:
                    only source_esx.esx_80
                    vm_os_label = "SLES_LATEST_VERSION"
                - opensuse_latest:
                    only source_esx.esx_80
                    expect_os_short_id = "OPENSUSE_LATEST_SHORT_ID"
                    vm_os_label = "OPENSUSE_LATEST_VERSION"
        - windows:
            no pv
            os_type = "windows"
            shutdown_command = "shutdown /s /f /t 0"
            reboot_command = "shutdown /r /f /t 0"
            status_test_command = "echo %errorlevel%"
            shell_prompt = "^\w:\\.*>\s*$"
            shell_linesep = "\r\n"
            shell_client = "nc"
            shell_port = 10022
            file_transfer_client = "rss"
            file_transfer_port = 10023
            redirs += " file_transfer"
            guest_port_remote_shell = 10022
            guest_port_file_transfer = 10023
            rtc_base = "localtime"
            network_query = "ipconfig /all"
            restart_network = "ipconfig /renew"
            vm_user = "Administrator"
            vm_pwd = DEFAULT_WIN_VM_PASSWORD
            variants:
                - win10:
                    only esx
                    vm_os_label = "win10"
                - win2016:
                    only esx
                    expect_os_short_id = "win2k16"
                    vm_os_label = "win2016"
                - win2019:
                    only esx
                    vm_os_label = "win2019"
                - win2022:
                    only esx
                    vm_os_label = "win2022"
                - win11:
                    only esx
                    vm_os_label = "win11"
                - win2025:
                    only esx
                    vm_os_label = "win2025"
    # Backwards compat: keep os_version aliased to vm_os_label so
    # the old ci-shared-datas template (${{os_version}}) still works
    # until the ci-shared-datas MR merges. Remove after both land.
    os_version = ${vm_os_label}
    variants:
        - esx:
            only source_esx
            vpx_pwd = ${vpx_password}
            vpx_passwd_file = "/tmp/v2v_vpx_passwd"
            v2v_opts = " -ip ${vpx_passwd_file}"
            variants:
                - 8_0:
                    only source_esx.esx_80
                    esx_version = "esx8.0"
                - 7_0:
                    only source_esx.esx_70
                    esx_version = "esx7.0"
            hostname = ${esx_hostname}
            variants:
                - vm:
                    # main_vm = ${esx_version}-${vm_os_label}-${vm_arch}${vm_boot}
                    main_vm = "ESX_VM_NAME_V2V_EXAMPLE"
