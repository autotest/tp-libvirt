- v2v_options:
    type = "v2v_options"
    vm_type = "libvirt"
    start_vm = "no"
    take_regular_screendumps = no
    remote_shell_client = "ssh"
    remote_shell_port = 22
    remote_shell_prompt = "^\w:\\.*>\s*$|^\[.*\][\#\$]\s*$"
    status_test_command = "echo $?"
    nfs_kvm_images = NFS_KVM_IMAGES_V2V_EXAMPLE
    output_network = "default"
    output_bridge = "virbr0"
    os_type = "linux"
    username = 'root'
    password = GENERAL_GUEST_PASSWORD
    # v2v cmd running time
    v2v_timeout = 10800
    v2v_login_timeout = 900
    vms = ''
    variants:
        - it_vddk:
            only source_esx
            input_transport = 'vddk'
            variants:
                - vpx_uri:
                - esx_uri:
                    src_uri_type = 'esx'
        - it_default:
    # Full types input disks
    variants:
        - output_mode:
            variants:
                - glance:
                    # No test yet
                    output_mode = "glance"
                - libvirt:
                    only dest_libvirt
                    target = "libvirt"
                - local:
                    only dest_local
                    output_storage = "/tmp"
                - null:
                    only dest_null
                - qemu:
                    # No test yet
                    output_mode = "qemu"
                - none:
                    only dest_none
    variants:
        - input_mode:
            variants:
                - disk:
                    only source_none
                    variants:
                        # Explicit 'sparse' and 'preallocated' here for
                        # parameters replacement
                        # This will cover option '-if'
                        - raw_format:
                            input_format = "raw"
                            variants:
                                - sparse:
                                    input_allo_mode = "sparse"
                                    main_vm = "VM_NAME_RAW_SPARSE_V2V_EXAMPLE"
                                    input_disk_image = "${main_vm}"
                                - preallocated:
                                    input_allo_mode = "preallocated"
                                    main_vm = "VM_NAME_RAW_PREALLOCATED_V2V_EXAMPLE"
                                    input_disk_image = "${main_vm}"
                        - qcow2_format:
                            input_format = "qcow2"
                            variants:
                                - sparse:
                                    input_allo_mode = "sparse"
                                    main_vm = "VM_NAME_QCOW2_SPARSE_V2V_EXAMPLE"
                                    input_disk_image = "${main_vm}"
                                - preallocated:
                                    input_allo_mode = "preallocated"
                                    main_vm = "VM_NAME_QCOW2_PREALLOCATED_V2V_EXAMPLE"
                                    input_disk_image = "${main_vm}"
                    variants:
                        - image:
                            input_mode = disk
                    new_vm_name = ${main_vm}_new
                    v2v_options = "-on ${new_vm_name}"
                - libvirt:
                    input_mode = "libvirt"
                    variants:
                        - kvm:
                            # All VM defined on the test machine
                            only source_kvm
                            hypervisor = "kvm"
                            variants:
                                - default:
                                - format:
                        - esx:
                            only source_esx
                            hypervisor = "esx"
                            remote_host = ${vpx_hostname}
                            vpx_dc = ${vpx_dc}
                            esx_ip = ${esx_hostname}
                            variants:
                                - esx_70:
                                    only source_esx.esx_70
                                - esx_80:
                                    only source_esx.esx_80
                - ova:
                    # No test yet
                    input_mode = "ova"
                - none:
                    only source_none
    variants:
        - positive_test:
            status_error = "no"
            variants:
                - option_version:
                    only input_mode.none
                    only output_mode.none
                    v2v_options = "--version"
                    checkpoint = check_version
                - option_help:
                    only input_mode.none
                    only output_mode.none
                    v2v_options = --help
                    in_man = 'ovirtmgmt'
                    not_in_man = rhvm
                - deprecated_options:
                    only input_mode.none
                    only output_mode.none
                    version_required = "[virt-v2v-2.8.1-8,)"
                    v2v_options = --help
                    variants:
                        - compressed:
                            in_man = '-oo compressed'
                            not_in_man = "--compressed"
                        - vddk:
                            in_man = '-io vddk-'
                            not_in_man = "--vddk-"
                        - no-trim:
                            not_in_man = "--no-trim"
                        - vmtype:
                            not_in_man = "--vmtype"
                        - password-file:
                            in_man = "-ip filename"
                            not_in_man = "--password-file"
                        - qemu-boot:
                            not_in_man = "--qemu-boot"
                - option_of:
                    only output_mode.libvirt
                    variants:
                        - from_disk:
                            # Set output format
                            only input_mode.disk
                            variants:
                                - raw_format:
                                    output_format = "raw"
                                - qcow2_format:
                                    output_format = "qcow2"
                            variants:
                                - sparse:
                                    output_allo_mode = "sparse"
                                - preallocated:
                                    output_allo_mode = "preallocated"
                - vmx:
                    only input_mode.none
                    only output_mode.libvirt
                    checkpoint = vmx
                    main_vm = VM_NAME_VMX_V2V_EXAMPLE
                    output_format = qcow2
                    nfs_vmx = NFS_VMX_V2V_EXAMPLE
                - print_source:
                    main_vm = VM_NAME_NO_OS_REQUIRED_V2V_EXAMPLE
                    only input_mode.libvirt.esx.esx_80
                    only output_mode.none
                    checkpoint = print_source
                    v2v_options = --print-source
                - machine_readable:
                    only input_mode.none
                    only output_mode.none
                    v2v_options = --machine-readable
                    checkpoint = machine_readable
                    example_file = MACHINE_READABLE_V2V_EXAMPLE
                    in_man = 'colours-option'
                - compress:
                    only output_mode.libvirt.it_vddk
                    only input_mode.libvirt.esx.esx_80
                    checkpoint = compress
                    main_vm = VM_NAME_ANY_OS_V2V_EXAMPLE
                    new_vm_name = ${main_vm}_compress
                    v2v_options = -of qcow2 -oo compressed -on ${new_vm_name}
                - empty_nic_source:
                    only input_mode.none
                    only output_mode.none
                    input_mode = libvirtxml
                    v2v_options = --print-source
                    checkpoint = empty_nic_source
                    variants:
                        - net:
                            checkpoint += _network
                        - br:
                            checkpoint += _bridge
                - memsize_smp:
                    only input_mode.none
                    only output_mode.none
                    variants:
                        - 5_millions_files:
                            disk_name = "VM_NAME_GUEST_WITH_EMPTY_5M_FILES_V2V_EXAMPLE"
                            input_disk_image = "${disk_name}"
                            v2v_options = '-i disk ${input_disk_image} --memsize 4000 --smp 10 -o null'
                        - 4_millions_files:
                            disk_name = "VM_NAME_GUEST_WITH_EMPTY_4M_FILES_V2V_EXAMPLE"
                            input_disk_image = "${disk_name}"
                            v2v_options = '-i disk ${input_disk_image} --memsize 4000 --smp 80 -o null'
                - cmd_free:
                    only input_mode.none
                    only output_mode.none
                    cmd_free = yes
                    variants:
                        - no_dcpath:
                            checkpoint = 'no_dcpath'
                            check_command = 'man virt-v2v'
                        - win_invalid_file:
                            win_image = IMAGE_WITH_INVALID_FILE_V2V_EXAMPLE
                            check_command = 'guestfish set-program virt-foo : add-ro ${win_image} : run : mount /dev/sda1 / : ll /test'
                - in_place:
                    only input_mode.none
                    only output_mode.none
                    checkpoint = 'in_place'
                    disk_path = DEFAULT_TEST_IMAGE
                    msg_content = 'virt-v2v-in-place: warning: virt-v2v-in-place is NOT SUPPORTED for command'
                    expect_msg = yes
                - virt_v2v_open:
                    only input_mode.libvirt.esx.esx_80
                    only output_mode.none
                    only it_vddk.vpx_uri
                    version_required = "[virt-v2v-2.8.1-8,)"
                    main_vm = VM_CBT_SNAPSHOT_V2V_EXAMPLE
                    checkpoint = 'virt_v2v_open'
                - virt_v2v_inspector:
                    only input_mode.libvirt.esx.esx_80
                    only output_mode.none
                    only it_vddk.vpx_uri
                    version_required = "[virt-v2v-2.8.1-8,)"
                    main_vm = VM_MULTIPLE_SNAPSHOTS_V2V_EXAMPLE
                    checkpoint = 'virt_v2v_inspector'
                - parallel:
                    only input_mode.libvirt.esx.esx_80
                    only output_mode.none
                    only it_vddk.vpx_uri
                    version_required = "[virt-v2v-2.7.1-2,)"
                    main_vm = VM_NAME_ANY_OS_V2V_EXAMPLE
                    checkpoint = 'check_parallel_option'
                - vddk_compression:
                    only input_mode.libvirt.esx.esx_80
                    version_required = "[virt-v2v-2.9.10-2,)"
                    main_vm = VM_NAME_ANY_OS_V2V_EXAMPLE
                    variants:
                        - zlib:
                            only it_vddk.vpx_uri
                            only output_mode.null
                            expect_msg = yes
                            msg_content = "running nbdkit.*?LANG=C.*?'--name'"
                            checkpoint = 'vddk_compression_zlib'
                        - skipz:
                            only it_vddk.esx_uri
                            only output_mode.null
                            expect_msg = yes
                            msg_content = "nbdkit.*: debug: count bytes: read.*written.*zeroed.*trimmed"
                            checkpoint = 'vddk_compression_skipz'
                        - fastlz:
                            only it_vddk.vpx_uri
                            only output_mode.none
                            expect_msg = yes
                            msg_content = "Filesystem.*?1K-blocks.*?Used.*?Available.*?Use.*?Mounted on"
                            checkpoint = 'vddk_compression_fastlz'
                - detect_gpo:
                    only input_mode.libvirt.esx.esx_80
                    only output_mode.none
                    only it_vddk.vpx_uri
                    version_required = "[virt-v2v-2.10.0-5,)"
                    main_vm = VM_NAME_WINDOWS_GUEST_WITH_GPO_V2V_EXAMPLE
                    checkpoint = 'detect_gpo_av'
                    msg_content = 'virt-v2v-inspector: warning: this guest has Windows Group Policy Objects \(GPO\).*?<windows_group_policy/>'
                    expect_msg = yes
                - detect_third_party_av:
                    only input_mode.libvirt.esx.esx_80
                    only output_mode.none
                    only it_vddk.vpx_uri
                    version_required = "[virt-v2v-2.10.0-5,)"
                    main_vm = VM_NAME_WINDOWS_GUEST_WITH_THIRD_PARTY_AV_V2V_EXAMPLE
                    checkpoint = 'detect_gpo_av'
                    msg_content = 'virt-v2v-inspector: warning: this guest has Anti-Virus \(AV\) software.*?<windows_antivirus/>'
                    expect_msg = yes
                - esx_host_ipv6:
                    only input_mode.libvirt.esx.esx_80
                    only it_vddk.esx_uri
                    only output_mode.none
                    checkpoint = 'esx_ipv6'
                    esx_ipv6_addr = ESXI_HOST_IPV6_ADDRESS_V2V_EXAMPLE
                    version_required = "[libvirt-11.10.0-4,)"
                    main_vm = VM_NAME_ANY_OS_V2V_EXAMPLE
        - negative_test:
            status_error = "yes"
            variants:
                - length_of_error:
                    only input_mode.none
                    only output_mode.none
                    checkpoint = 'length_of_error'
                    variants:
                        - with_domain:
                            v2v_options = '-ic sdll://sdfl test'
                        - without_domain:
                            v2v_options = '-ic sdll://sdfl'
                - no_wrap:
                    only input_mode.none
                    only output_mode.none
                    checkpoint = 'line_no_wrap'
                    version_required = "[virt-v2v-1.45.99-1,)"
                    v2v_options = '-ic sdll://sdfl test'
                - if_wrong_format:
                    only output_mode.none
                    variants:
                        - if_qcow2:
                            only input_mode.disk.image.raw_format.sparse
                            input_format = qcow2
                            msg_content = 'Image is not in qcow2 format'
                            expect_msg = yes
                        - if_raw:
                            only input_mode.disk.image.qcow2_format.sparse
                            input_format = raw
                            msg_content = 'No root device found in this operating system image'
                            expect_msg = yes
                - invaild_null_option:
                    only input_mode.libvirt.kvm.default
                    only output_mode.none
                    checkpoint = 'option_null'
                    msg_content = 'cannot be used in this output mode'
                    expect_msg = yes
                    variants:
                        - oa:
                            v2v_options = "-o null -oa preallocated"
                        - oc:
                            v2v_options = "-o null -oc qemu+ssh:///system"
                        - of:
                            v2v_options = "-o null -of qcow2"
                        - os:
                            v2v_options = "-o null -os default"
                - dnf_error:
                    only input_mode.disk.image.qcow2_format.preallocated
                    only output_mode.null
                    version_required = "[virt-v2v-2.8.1-8,)"
                    v2v_options = '--install virt-v2v'
                    msg_content = 'Unknown argument'
                    expect_msg = no
                - vpx_with_invalid_esx_ipv6:
                    only input_mode.libvirt.esx.esx_80
                    only it_vddk.vpx_uri
                    only output_mode.none
                    checkpoint = 'vpx_with_invalid_esx_ipv6'
                    vpx_ipv6_addr = VCENTER_HOST_IPV6_ADDRESS_V2V_EXAMPLE
                    version_required = "[libvirt-11.10.0-8,)"
                    main_vm = VM_NAME_NO_OS_REQUIRED_V2V_EXAMPLE
                    msg_content = 'comparing path element.*?with candidate name'
                    expect_msg = yes
                - invalid_vddk_thumbprint:
                    only input_mode.libvirt.esx.esx_80
                    only it_vddk.vpx_uri
                    only output_mode.none
                    version_required = "[virt-v2v-2.5.4-1,)"
                    main_vm = VM_NAME_NO_OS_REQUIRED_V2V_EXAMPLE
                    vddk_thumbprint = 'AA:2B:AD'
                    # RHEL-37682 was closed as NOTABUG.
                    msg_content_yes = 'server reported: VDDK "Unknown error" can be caused by several problems'
                - must_ip:
                    only input_mode.libvirt.esx.esx_80
                    only it_default
                    only output_mode.none
                    version_required = "[virt-v2v-1.45.98-1,)"
                    main_vm = VM_NAME_NO_OS_REQUIRED_V2V_EXAMPLE
                    cmd_has_ip = no
                    msg_content_yes = 'virt-v2v: error: -i libvirt: expecting -ip passwordfile parameter'
